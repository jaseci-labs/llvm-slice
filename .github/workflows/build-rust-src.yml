name: Build Rust source slice

# What neojac's build of rustc reads of a Rust release besides what neojac keeps
# in its own repository (rust-src/README.md). Only repackages source, so one job
# does it, on any machine.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision of the slice for this Rust version (the release is rust-src-v<version>-<revision>)"
        required: true
      publish:
        description: "Publish the release"
        type: boolean
        default: true
  pull_request:
    paths:
      - "rust-src/**"
      - "scripts/pack_slice.jac"
      - ".github/workflows/build-rust-src.yml"

permissions:
  contents: write

env:
  RUST_VERSION: "1.99.0"
  JACLANG_VERSION: "0.16.7"

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REVISION: ${{ inputs.revision || '1' }}
      WORK: ${{ github.workspace }}/.work
      SRC_CACHE: ${{ github.workspace }}/.src
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "jaclang==$JACLANG_VERSION"

      - name: The tree
        run: |
          mkdir -p "$WORK" "$SRC_CACHE"
          sh rust-src/build.sh tree

      - name: Pack the slice
        run: jac run scripts/pack_slice.jac --kind rust-src --tree tree --version "$RUST_VERSION" --revision "$REVISION" --out-dir dist | tee record.json

      - name: Publish rust-src-v${{ env.RUST_VERSION }}-${{ env.REVISION }}
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="rust-src-v$RUST_VERSION-$REVISION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$tag exists; publish a new revision instead of replacing one consumers pin"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
            --title "Rust $RUST_VERSION source slice (revision $REVISION)" \
            --notes "What neojac's build of rustc reads of Rust $RUST_VERSION besides what neojac keeps in its own repository (rust-src/README.md). Pin rust-src-$RUST_VERSION-manifest.json by its sha256 (record.json)." \
            dist/* record.json
