name: Build libc++ LLVM slice

# Build a libc++ LLVM from source and publish it as a range-fetchable dev slice,
# in the SAME zip+manifest format the repackage path produces for official
# tarballs. This is the one place in this repo that DOES build LLVM: the official
# Linux releases are libstdc++ (std::__cxx11::*), and a consumer that links the
# archives with a libc++ toolchain (e.g. Zig's `zig c++`) needs the matching
# libc++ ABI (std::__1::*). No upstream release ships a libc++ Linux build, so it
# has to be produced here.
#
# The compiler is `zig cc`/`zig c++` pinned to an explicit glibc floor
# (<arch>-linux-gnu.2.17). That single choice gives three properties at once:
#   - libc++ ABI    -- zig c++ uses libc++, so the archives are std::__1::*.
#   - low glibc floor -- the archives' libc references resolve at 2.17 when a
#                        consumer links them, matching CPython's manylinux2014 floor.
#   - no arc4random  -- configure probes against the 2.17 headers, so the 2.36+
#                        arc4random symbol is never detected and never referenced.
# No container and no special runner: a plain GitHub-hosted runner with Zig.
#
# `zig cc` emits DWARF even in a Release configuration (CMake's Release flags
# carry no -g, but Zig's default is to keep debug info), so the wrappers pass
# -g0: the slice ships what the official release archives ship, optimized code
# without debug info. A slice built without it is ~2x the size, and so is every
# shared library a consumer links from it.
#
# The slice carries the same dev surface as the official release archives:
# LLVM, Clang (its static libraries, headers and resource headers) and,
# with the `lld` input, LLD. Like the official archives, LLVM compresses with
# zlib and zstd: static builds of both at the same floor
# (runtimes/host-libs.sh), which the runtimes slice ships as
# host/linux-<arch>/ for a consumer to link with the archives.
#
# A slice once published is pinned by its consumers: a rebuild for the same
# LLVM version is a new revision, whose triple carries a -r<revision> suffix.
#
# Downstream is unchanged: the built install tree flows through the existing
# `scripts/repackage.jac --work-dir` path (classify CMake -> measure libs -> emit
# dev zip + manifest -> index.json), exactly like an official tarball.
#
# Both Linux arches build NATIVELY: x86_64 on ubuntu-latest, aarch64 on the
# GitHub-hosted ubuntu-24.04-arm runner (no cross build -- only the glibc floor
# and C++ runtime differ from the host).
#
# The Windows slice (`x86_64-windows-libcxx-lld`) is libc++ too: the official
# Windows release is built for MSVC's C++ ABI and runtime, which a mingw-w64
# toolchain (Clang, LLD, libc++, the Universal CRT) cannot link. llvm/windows.sh
# cross-builds it on Linux with the release's Clang against the runtimes
# slice's own mingw-w64 and libc++ builds, and zlib and zstd from
# runtimes/host-libs.sh (host/windows-x86_64/ in the runtimes slice).
#
# Select the slices with the `platforms` input.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "LLVM version to build (matches the upstream llvmorg-<version> tag)"
        type: string
        default: "22.1.8"
      platforms:
        description: "Which slice(s) to build"
        type: choice
        options: [all, linux, linux-x86_64, linux-aarch64, windows-x86_64]
        default: "all"
      targets:
        description: "LLVM_TARGETS_TO_BUILD (semicolon-separated, or all)"
        type: string
        default: "all"
      lld:
        description: "Also build LLD's libraries (lld/ projects) into the Linux slices; names the slice triple with a -lld suffix (the Windows slice always has them)"
        type: boolean
        default: true
      revision:
        description: "Revision of the slice for this LLVM version; a revision after 1 names the triple with a -r<revision> suffix, so a consumer's pin of an earlier one keeps working"
        type: string
        default: "1"
      dry_run:
        description: "Build the slice but do not publish a release"
        type: boolean
        default: true
      draft_release:
        description: "Publish the release as a draft"
        type: boolean
        default: false

concurrency:
  group: build-libcxx-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JACLANG_VERSION: "0.16.7"
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    if: inputs.platforms != 'windows-x86_64'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON('{"all":["x86_64","aarch64"],"linux":["x86_64","aarch64"],"linux-x86_64":["x86_64"],"linux-aarch64":["aarch64"]}')[inputs.platforms] }}
    # Native build per arch: same-arch runner, only the glibc floor and C++
    # runtime differ from the host toolchain.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      # The slice triple for the libc++ build. Distinct from the official
      # `<arch>-linux` slices so both can coexist on the same v<version> release.
      SLICE_TRIPLE: "${{ matrix.arch }}-linux-libcxx${{ inputs.lld && '-lld' || '' }}${{ inputs.revision != '1' && format('-r{0}', inputs.revision) || '' }}"
      # Glibc floor baked into the archives' libc references (matches CPython/PBS
      # manylinux2014, both arches).
      ZIG_TARGET: "${{ matrix.arch }}-linux-gnu.2.17"
    steps:
      - name: Free disk space
        # A full LLVM build + install is many GB; reclaim the image's bulky
        # preinstalled toolchains (paths that don't exist on a given runner
        # image, e.g. arm, are skipped by the || true).
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jaclang==${JACLANG_VERSION}"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Stage build dirs
        # Prefer the Azure temp disk (/mnt, ~67 GB on the x86_64 runners) when it
        # has room; the arm runners' disk layout differs, so fall back to the
        # runner's own filesystem (RUNNER_TEMP) when /mnt is absent or small.
        # Everything downstream uses $WORK. /mnt is root-owned; chown after mkdir.
        run: |
          set -euo pipefail
          if [ -d /mnt ] && [ "$(df -Pm /mnt | awk 'NR==2{print $4}')" -ge 40960 ]; then
            BASE=/mnt
          else
            BASE="$RUNNER_TEMP"
          fi
          echo "WORK=$BASE" >> "$GITHUB_ENV"
          for d in llvm-src llvm-build llvm-install llvm-out zig-wrap host-work host-src host-libs; do
            sudo mkdir -p "$BASE/$d"
            sudo chown "$(id -u):$(id -g)" "$BASE/$d"
          done
          df -h "$BASE"

      - name: Fetch LLVM source
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${V}/llvm-project-${V}.src.tar.xz"
          echo "downloading $URL"
          curl -fsSL -o "$WORK/llvm-src/llvm-project.tar.xz" "$URL"
          tar -xf "$WORK/llvm-src/llvm-project.tar.xz" -C "$WORK/llvm-src" --strip-components=1
          rm -f "$WORK/llvm-src/llvm-project.tar.xz"
          test -d "$WORK/llvm-src/llvm"

      - name: Zig compiler wrappers (libc++ + glibc 2.17 floor)
        # cmake needs a single-token compiler path; wrap the multi-word `zig cc`
        # / `zig c++ -target ...` invocations. The target pins both the C++
        # runtime (libc++) and the glibc floor for every translation unit.
        run: |
          set -euo pipefail
          cat > "$WORK/zig-wrap/zcc" <<EOF
          #!/bin/sh
          exec zig cc -target ${ZIG_TARGET} "\$@" -g0
          EOF
          cat > "$WORK/zig-wrap/zcxx" <<EOF
          #!/bin/sh
          exec zig c++ -target ${ZIG_TARGET} "\$@" -g0
          EOF
          chmod +x "$WORK/zig-wrap/zcc" "$WORK/zig-wrap/zcxx"
          # Fail now, not after the build, if the wrappers still emit DWARF.
          printf 'int f(int x) { return x * 3; }\n' > "$WORK/zig-wrap/probe.cpp"
          "$WORK/zig-wrap/zcxx" -O3 -DNDEBUG -c "$WORK/zig-wrap/probe.cpp" -o "$WORK/zig-wrap/probe.o"
          if readelf -S --wide "$WORK/zig-wrap/probe.o" | grep -q '\.debug_'; then
            echo "::error::the compiler wrappers emit debug info"
            exit 1
          fi

      - name: zlib and zstd (static, glibc 2.17 floor)
        # What LLVM compresses with (compressed debug sections: LLD's
        # --compress-debug-sections, and reading objects that carry them).
        # runtimes/host-libs.sh builds them with this Zig; the runtimes slice
        # ships the same build as host/linux-<arch>/, which a consumer links
        # with the archives, as it links the official macOS archives with
        # host/macos-aarch64/.
        run: |
          set -euo pipefail
          WORK="$WORK/host-work" SRC_CACHE="$WORK/host-src" \
            sh runtimes/host-libs.sh "linux-${{ matrix.arch }}" "$WORK/host-libs"

      - name: Configure (CMake + Ninja, static libc++ dev surface)
        # Static archives only, no shared libLLVM, no tools/tests/examples.
        # zlib and zstd are the static libraries the step above built (and
        # the runtimes slice ships); every other optional host-probing external
        # is OFF: a consumer links the archives statically with no system
        # libraries (libxml2, terminfo, ...), so LLVM must not reference them.
        run: |
          set -euo pipefail
          cmake -G Ninja \
            -S "$WORK/llvm-src/llvm" \
            -B "$WORK/llvm-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$WORK/zig-wrap/zcc" \
            -DCMAKE_CXX_COMPILER="$WORK/zig-wrap/zcxx" \
            -DCMAKE_INSTALL_PREFIX="$WORK/llvm-install" \
            -DLLVM_ENABLE_LIBCXX=ON \
            -DLLVM_TARGETS_TO_BUILD="${{ inputs.targets }}" \
            -DLLVM_ENABLE_PROJECTS="clang${{ inputs.lld && ';lld' || '' }}" \
            -DLLVM_ENABLE_RUNTIMES="" \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=ON \
            -DCLANG_BUILD_TOOLS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DCLANG_BUILD_EXAMPLES=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_ZLIB=FORCE_ON \
            -DLLVM_ENABLE_ZSTD=FORCE_ON \
            -DLLVM_USE_STATIC_ZSTD=ON \
            -DCMAKE_PREFIX_PATH="$WORK/host-libs" \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_HTTPLIB=OFF

      - name: Build + install
        run: |
          set -euo pipefail
          ninja -C "$WORK/llvm-build" install
          df -h "$WORK" /

      - name: Prune install to the dev surface
        # build_dev_zip walks the whole tree; the official slice ships only
        # lib/ + include/ + bin/llvm-config, so drop the rest of bin/ (llc, opt,
        # ...) to keep the slice lean.
        run: |
          set -euo pipefail
          find "$WORK/llvm-install/bin" -mindepth 1 -maxdepth 1 \
            ! -name 'llvm-config' -exec rm -rf {} + || true
          # Static archives only: drop the shared libraries Clang's tools
          # directory builds (libclang.so*).
          find "$WORK/llvm-install/lib" -maxdepth 1 -name '*.so*' -exec rm -f {} +
          test -f "$WORK/llvm-install/lib/cmake/llvm/LLVMConfig.cmake"
          test -f "$WORK/llvm-install/lib/cmake/llvm/LLVMExports.cmake"
          # LLVM compresses and decompresses with both.
          for f in ZLIB ZSTD; do
            grep -q "#define LLVM_ENABLE_$f 1" "$WORK/llvm-install/include/llvm/Config/llvm-config.h" \
              || { echo "::error::LLVM_ENABLE_$f is off"; exit 1; }
          done
          # Clang: the libraries a driver links, its headers, and the resource
          # headers (stddef.h, the intrinsics) every compilation includes.
          for lib in clangBasic clangLex clangParse clangSema clangAST clangAnalysis \
                     clangEdit clangSerialization clangCodeGen clangDriver clangFrontend \
                     clangFrontendTool clangRewrite clangAPINotes clangSupport; do
            test -f "$WORK/llvm-install/lib/lib$lib.a"
          done
          test -f "$WORK/llvm-install/include/clang/Driver/Driver.h"
          V="${{ inputs.version }}"
          test -f "$WORK/llvm-install/lib/clang/${V%%.*}/include/stddef.h"
          if [ "${{ inputs.lld }}" = "true" ]; then
            for lib in lldCommon lldELF lldMachO lldCOFF lldWasm; do
              test -f "$WORK/llvm-install/lib/lib$lib.a"
            done
            test -f "$WORK/llvm-install/include/lld/Common/Driver.h"
          fi
          # No archive member may carry DWARF (see the -g0 note at the top).
          dbg=""
          for a in "$WORK"/llvm-install/lib/*.a; do
            n="$(readelf -S --wide "$a" 2>/dev/null | grep -c '\.debug_info' || true)"
            if [ "$n" != "0" ]; then dbg="$dbg $(basename "$a")"; fi
          done
          if [ -n "$dbg" ]; then
            echo "::error::archives carry debug info:$dbg"
            exit 1
          fi
          du -sh "$WORK/llvm-install/lib"

      - name: Repackage built tree into a dev slice
        id: pack
        run: |
          set -euo pipefail
          jac run scripts/repackage.jac \
            --version "${{ inputs.version }}" \
            --triple "${SLICE_TRIPLE}" \
            --work-dir "$WORK/llvm-install" \
            --out-dir "$WORK/llvm-out" > "$WORK/llvm-out/record-${SLICE_TRIPLE}.json"
          echo "--- record ---"
          cat "$WORK/llvm-out/record-${SLICE_TRIPLE}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ env.SLICE_TRIPLE }}
          path: |
            ${{ env.WORK }}/llvm-out/*-dev.zip
            ${{ env.WORK }}/llvm-out/*-manifest.json
            ${{ env.WORK }}/llvm-out/record-*.json
          if-no-files-found: error
          retention-days: 7

  windows:
    # The Windows slice, cross-built on Linux by llvm/windows.sh: mingw-w64
    # against the Universal CRT, with LLVM's libc++ (the runtimes slice's C++
    # runtime for x86_64-windows-gnu), the toolchain neojac builds every Windows
    # program with. LLD's libraries are always in it.
    if: inputs.platforms == 'all' || inputs.platforms == 'windows-x86_64'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SLICE_TRIPLE: "x86_64-windows-libcxx-lld${{ inputs.revision != '1' && format('-r{0}', inputs.revision) || '' }}"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jaclang==${JACLANG_VERSION}"

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build

      - name: Work directory
        # The Azure temp disk (/mnt) when it has room, as the Linux builds use.
        run: |
          set -euo pipefail
          if [ -d /mnt ] && [ "$(df -Pm /mnt | awk 'NR==2{print $4}')" -ge 40960 ]; then
            BASE=/mnt/work
          else
            BASE="$RUNNER_TEMP/work"
          fi
          sudo mkdir -p "$BASE"
          sudo chown "$(id -u):$(id -g)" "$BASE"
          echo "WORK=$BASE" >> "$GITHUB_ENV"

      - name: Build LLVM, Clang and LLD for Windows
        run: |
          set -euo pipefail
          [ "${{ inputs.version }}" = "$(sed -n 's/^LLVM_VERSION=//p' runtimes/lib.sh)" ] \
            || { echo "::error::llvm/windows.sh builds the LLVM runtimes/lib.sh pins"; exit 1; }
          sh llvm/windows.sh "$WORK/llvm-install" "${{ inputs.targets }}"

      - name: Repackage built tree into a dev slice
        run: |
          set -euo pipefail
          mkdir -p "$WORK/llvm-out"
          jac run scripts/repackage.jac \
            --version "${{ inputs.version }}" \
            --triple "${SLICE_TRIPLE}" \
            --work-dir "$WORK/llvm-install" \
            --out-dir "$WORK/llvm-out" > "$WORK/llvm-out/record-${SLICE_TRIPLE}.json"
          cat "$WORK/llvm-out/record-${SLICE_TRIPLE}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ env.SLICE_TRIPLE }}
          path: |
            ${{ env.WORK }}/llvm-out/*-dev.zip
            ${{ env.WORK }}/llvm-out/*-manifest.json
            ${{ env.WORK }}/llvm-out/record-*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, windows]
    if: ${{ !inputs.dry_run && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jaclang==${JACLANG_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload libc++ slice to release v${{ env.VERSION }}
        # Coexists with the official repackaged slices on the same v<version>
        # release; the -libcxx triple keeps the asset names distinct. --clobber
        # makes re-runs idempotent. Reuses (does not replace) index.json from the
        # repackage workflow -- the libc++ slice is consumed by triple directly.
        run: |
          set -euo pipefail
          DRAFT=()
          if [ "${{ inputs.draft_release }}" = "true" ]; then DRAFT+=(--draft); fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --title "LLVM $VERSION (repackaged dev slices)" \
              --notes "Range-fetchable dev zips + dependency manifests for LLVM $VERSION." \
              "${DRAFT[@]}"
          fi
          gh release upload "v$VERSION" --clobber \
            dist/*/*-dev.zip dist/*/*-manifest.json
          echo "Published libc++ slice for v$VERSION"
