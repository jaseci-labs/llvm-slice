name: Build Rust slice

# The Rust slice: rustc and its tools for every host neojac runs on, and the
# standard library of every target neojac cc links for, built against an LLVM
# library that carries rustc's LLVM wrapper (neojac's libneollvm at run
# time), as one range-fetchable zip (the dev slices' format) with a manifest
# pinning every member. rust/README.md has the layout and how it is made.
#
#   rust/host/<host>/       rustc (with rustdoc), cargo, clippy and rustfmt
#   rust/target/<target>/   the standard library (lib/rustlib/<target>/)
#   rust/SOURCES.txt
#
# Each platform's job builds with the platform's own C toolchain, as Rust's
# releases do: Linux in manylinux2014 (GCC, glibc 2.17) natively on each
# architecture, macOS with Xcode, Windows on Linux with llvm-mingw.
#
# Pull requests that touch the build run it without publishing.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision of the slice for this Rust version (the release is rust-v<version>-<revision>)"
        type: string
        default: "1"
      dry_run:
        description: "Build and check the slice, but do not publish it"
        type: boolean
        default: true
  pull_request:
    paths:
      - "rust/**"
      - "runtimes/lib.sh"
      - "scripts/pack_slice.jac"
      - ".github/workflows/build-rust.yml"

concurrency:
  group: build-rust-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUST_VERSION: "1.99.0"
  JACLANG_VERSION: "0.16.7"
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    # Each platform's job builds its Rust host's tools, and the standard
    # library of the targets its toolchain builds (rust/build.sh): Linux in
    # manylinux2014 (GCC, glibc 2.17), natively on each architecture; macOS
    # natively with Xcode; Windows on Linux with llvm-mingw.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64@sha256:62eeff30ef134a85ec0f97109e008a319b0315ca5e8a6d754ee771556c02622a
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64@sha256:101d2292840109c9d329fcfcd7b89b46f59e19ca23cbfdcf059fb389994665fc
          - platform: macos-aarch64
            runner: macos-26
          - platform: windows-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: ${{ env.ZIG_VERSION }}

      # The Azure temp disk holds the build (tens of GB) when it has room.
      - name: Work directories
        run: |
          set -eu
          base="$RUNNER_TEMP/rust"
          if [ -d /mnt ] && [ "$(df -Pm /mnt | awk 'NR==2{print $4}')" -ge 40960 ]; then
            base=/mnt/rust
          fi
          sudo mkdir -p "$base"
          sudo chown "$(id -u):$(id -g)" "$base"
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "WORK=$base/work" >> "$GITHUB_ENV"
          echo "SRC_CACHE=$base/src" >> "$GITHUB_ENV"
          df -h "$base"

      - uses: actions/cache@v4
        with:
          path: ${{ env.SRC_CACHE }}
          key: rust-src-${{ matrix.platform }}-${{ hashFiles('rust/sources.txt', 'runtimes/sources.txt') }}

      - name: Build ${{ matrix.platform }}
        run: |
          set -eu
          if [ -n "${{ matrix.image }}" ]; then
            # manylinux2014's own GCC and glibc 2.17; Zig from the runner.
            # OpenSSL's Configure (cargo's) needs IPC::Cmd and Time::Piece.
            zig="$(dirname "$(command -v zig)")"
            docker run --rm -v "$PWD:/w" -v "$BASE:$BASE" -v "$zig:/zig" -w /w \
              -e WORK -e SRC_CACHE -e "JOBS=$(nproc)" "${{ matrix.image }}" sh -c \
              "yum install -y -q perl-IPC-Cmd perl-Time-Piece > /dev/null && PATH=/zig:/opt/python/cp312-cp312/bin:\$PATH sh rust/build.sh ${{ matrix.platform }} /w/out"
            sudo chown -R "$(id -u):$(id -g)" out "$BASE"
          else
            sh rust/build.sh ${{ matrix.platform }} out
          fi
          tar -cf part.tar -C out .
          du -sh out/rust/*/*

      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.platform }}
          path: part.tar
          retention-days: 7

  pack:
    needs: build
    runs-on: ubuntu-24.04
    env:
      REVISION: ${{ inputs.revision || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jaclang==${JACLANG_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble and check
        run: |
          set -eu
          mkdir -p tree
          for a in artifacts/*/part.tar; do tar -xf "$a" -C tree; done
          for h in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            test -f "tree/rust/host/$h/bin/rustc" || { echo "::error::no rustc for $h"; exit 1; }
            test -f "tree/rust/host/$h/bin/cargo" || { echo "::error::no cargo for $h"; exit 1; }
          done
          test -f tree/rust/host/x86_64-pc-windows-gnullvm/bin/rustc.exe
          test -f tree/rust/host/x86_64-pc-windows-gnullvm/bin/cargo.exe
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl \
                   aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin \
                   x86_64-pc-windows-gnullvm wasm32-wasip1; do
            ls "tree/rust/target/$t/lib" | grep -q '^libstd-' || { echo "::error::no standard library for $t"; exit 1; }
          done
          # What each host's tools import from the LLVM library, which a
          # consumer's library for the host must export (rust/build.sh).
          for h in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-gnullvm; do
            test -s "tree/rust/host/$h/neollvm-imports.txt" || { echo "::error::no neollvm-imports.txt for $h"; exit 1; }
          done
          {
            echo "# Built from these pinned inputs (llvm-slice rust/sources.txt; the LLVM"
            echo "# sources and wasi-libc are pinned in runtimes/sources.txt), with Zig $ZIG_VERSION:"
            grep -v '^#' rust/sources.txt | grep -v '^$'
            grep -E '^(llvm-project-22.1.8.src.tar.xz|wasi-sysroot-34.0.tar.gz) ' runtimes/sources.txt
            echo "# and patched with llvm-slice rust/*.patch"
          } > tree/rust/SOURCES.txt
          du -sh tree/rust/host/* tree/rust/target/*
      - name: Pack the slice
        id: pack
        run: |
          set -eu
          rev="$REVISION"
          [ "$rev" = 0 ] && rev=1
          jac run scripts/pack_slice.jac --kind rust --tree tree --version "$RUST_VERSION" --revision "$rev" --out-dir dist | tee record.json
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-slice
          path: |
            dist/*
            record.json
          retention-days: 7
      - name: Publish rust-v${{ env.RUST_VERSION }}-${{ steps.pack.outputs.revision }}
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="rust-v$RUST_VERSION-${{ steps.pack.outputs.revision }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$tag exists; publish a new revision instead of replacing one consumers pin"
            exit 1
          fi
          gh release create "$tag" --latest=false \
            --title "Rust $RUST_VERSION slice (revision ${{ steps.pack.outputs.revision }})" \
            --notes "rustc, cargo, rustdoc, clippy and rustfmt $RUST_VERSION for x86_64/aarch64 Linux, macOS arm64 and Windows x86_64 (gnullvm), and the standard library of every target neojac cc links for, built against an LLVM library carrying rustc's LLVM wrapper (neojac's libneollvm at run time; rust/README.md). Pin rust-$RUST_VERSION-manifest.json by its sha256 (record.json)." \
            dist/* record.json
