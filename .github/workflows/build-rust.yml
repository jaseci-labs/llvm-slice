name: Build Rust slice

# The Rust slice: rustc and its tools for every host neojac runs on, and the
# standard library of every target neojac cc links for, built against an LLVM
# library that carries rustc's LLVM wrapper (neojac's libneollvm at run
# time), as one range-fetchable zip (the dev slices' format) with a manifest
# pinning every member. rust/README.md has the layout and how it is made.
#
#   rust/host/<host>/       rustc (with rustdoc), cargo, clippy and rustfmt
#   rust/target/<target>/   the standard library (lib/rustlib/<target>/)
#   rust/neollvm-imports.txt
#   rust/SOURCES.txt
#
# Everything builds on linux-x86_64: each host's job builds the compiler
# that runs here, then cross-compiles that host's tools; one job builds every
# target's standard library.
#
# Pull requests that touch the build run it without publishing.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision of the slice for this Rust version (the release is rust-v<version>-<revision>)"
        type: string
        default: "1"
      dry_run:
        description: "Build and check the slice, but do not publish it"
        type: boolean
        default: true
  pull_request:
    paths:
      - "rust/**"
      - "runtimes/lib.sh"
      - "scripts/pack_slice.jac"
      - ".github/workflows/build-rust.yml"

concurrency:
  group: build-rust-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUST_VERSION: "1.99.0"
  JACLANG_VERSION: "0.16.7"
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        part:
          - host x86_64-unknown-linux-gnu
          - host aarch64-unknown-linux-gnu
          - host aarch64-apple-darwin
          - host x86_64-pc-windows-gnullvm
          - std
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The Azure temp disk holds the build (tens of GB) when it has room.
      - name: Work directories
        run: |
          set -eu
          if [ -d /mnt ] && [ "$(df -Pm /mnt | awk 'NR==2{print $4}')" -ge 40960 ]; then
            base=/mnt/rust
          else
            base="$RUNNER_TEMP/rust"
          fi
          sudo mkdir -p "$base"
          sudo chown "$(id -u):$(id -g)" "$base"
          echo "WORK=$base/work" >> "$GITHUB_ENV"
          echo "SRC_CACHE=$base/src" >> "$GITHUB_ENV"
          echo "PART_NAME=$(echo '${{ matrix.part }}' | tr ' ' '-')" >> "$GITHUB_ENV"
          df -h "$base"

      - uses: actions/cache@v4
        with:
          path: ${{ env.SRC_CACHE }}
          key: rust-src-${{ hashFiles('rust/sources.txt', 'runtimes/sources.txt') }}

      - name: Build ${{ matrix.part }}
        run: |
          set -eu
          sh rust/build.sh ${{ matrix.part }} out
          tar -cf part.tar -C out .
          df -h "$WORK"

      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ env.PART_NAME }}
          path: part.tar
          retention-days: 7

  pack:
    needs: build
    runs-on: ubuntu-24.04
    env:
      REVISION: ${{ inputs.revision || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jaclang==${JACLANG_VERSION}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble and check
        run: |
          set -eu
          mkdir -p tree
          for a in artifacts/*/part.tar; do tar -xf "$a" -C tree; done
          for h in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            test -f "tree/rust/host/$h/bin/rustc" || { echo "::error::no rustc for $h"; exit 1; }
            test -f "tree/rust/host/$h/bin/cargo" || { echo "::error::no cargo for $h"; exit 1; }
          done
          test -f tree/rust/host/x86_64-pc-windows-gnullvm/bin/rustc.exe
          test -f tree/rust/host/x86_64-pc-windows-gnullvm/bin/cargo.exe
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl \
                   aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin \
                   x86_64-pc-windows-gnullvm wasm32-wasip1; do
            ls "tree/rust/target/$t/lib" | grep -q '^libstd-' || { echo "::error::no standard library for $t"; exit 1; }
          done
          # What rustc's binaries import from the LLVM library, which a
          # consumer's library must export.
          nm -D --undefined-only tree/rust/host/*-linux-gnu/lib/*.so | awk '{ print $2 }' \
            | grep '^LLVM' | sort -u > tree/rust/neollvm-imports.txt
          test -s tree/rust/neollvm-imports.txt
          {
            echo "# Built from these pinned inputs (llvm-slice rust/sources.txt; the LLVM"
            echo "# sources and wasi-libc are pinned in runtimes/sources.txt), with Zig $ZIG_VERSION:"
            grep -v '^#' rust/sources.txt | grep -v '^$'
            grep -E '^(llvm-project-22.1.8.src.tar.xz|wasi-sysroot-34.0.tar.gz) ' runtimes/sources.txt
            echo "# and patched with llvm-slice rust/rustc-llvm-wrapper-in-llvm.patch"
          } > tree/rust/SOURCES.txt
          du -sh tree/rust/host/* tree/rust/target/*
      - name: Pack the slice
        id: pack
        run: |
          set -eu
          rev="$REVISION"
          [ "$rev" = 0 ] && rev=1
          jac run scripts/pack_slice.jac --kind rust --tree tree --version "$RUST_VERSION" --revision "$rev" --out-dir dist | tee record.json
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-slice
          path: |
            dist/*
            record.json
          retention-days: 7
      - name: Publish rust-v${{ env.RUST_VERSION }}-${{ steps.pack.outputs.revision }}
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="rust-v$RUST_VERSION-${{ steps.pack.outputs.revision }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$tag exists; publish a new revision instead of replacing one consumers pin"
            exit 1
          fi
          gh release create "$tag" --latest=false \
            --title "Rust $RUST_VERSION slice (revision ${{ steps.pack.outputs.revision }})" \
            --notes "rustc, cargo, rustdoc, clippy and rustfmt $RUST_VERSION for x86_64/aarch64 Linux, macOS arm64 and Windows x86_64 (gnullvm), and the standard library of every target neojac cc links for, built against an LLVM library carrying rustc's LLVM wrapper (neojac's libneollvm at run time; rust/README.md). Pin rust-$RUST_VERSION-manifest.json by its sha256 (record.json)." \
            dist/* record.json
